name: lavalynx release

# Tag a commit (lavalynx/dev tag) and the signed APK appears as a release asset: a
# plain HTTPS file the phone installs in one tap, and what Obtainium watches.
# A manual dispatch builds the same thing and keeps it as a run artifact instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance is signed through Sigstore, which needs an OIDC token.
  id-token: write
  attestations: write

concurrency:
  group: lavalynx-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MOZCONFIG: ${{ github.workspace }}/lavalynx/mozconfig
  # Artifact mode walks back through the commit history for the nearest commit
  # Mozilla's CI built. The checkout is shallow, so it deepens it from here.
  MOZ_SOURCE_GIT_REPO: https://github.com/${{ github.repository }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The runner image ships toolchains we never touch; the Firefox checkout
      # plus the Android SDK and Gradle caches need the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        # Shallow on purpose: the full history is several GB. mach deepens what
        # it needs for artifact lookup (see MOZ_SOURCE_GIT_REPO above).
        with:
          fetch-depth: 1

      - name: Cache mach state (JDK, Android SDK, node, python)
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ hashFiles('python/mozboot/**', 'build/moz.configure/**', 'mobile/android/*.configure') }}
          restore-keys: mozbuild-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/libs.versions.toml', 'mobile/android/**/*.gradle', 'mobile/android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Bootstrap (Android artifact mode)
        run: |
          ./mach --no-interactive bootstrap \
            --application-choice "GeckoView/Firefox for Android Artifact Mode" \
            --no-system-changes

      - name: Fetch Gecko artifacts and build GeckoView
        run: ./mach build

      - name: Assemble the APK
        # Unsigned: Fenix would otherwise sign it with the debug key, and a
        # debug-signed build cannot be upgraded by a properly signed one.
        run: ./mach gradle fenix:assembleNightly -PdisableDebugSigning=true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LAVALYNX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::LAVALYNX_KEYSTORE_BASE64 is not set; the APK would be unsigned"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lavalynx-release.jks"

      - name: Sign and name the APK
        id: apk
        env:
          STORE_PASSWORD: ${{ secrets.LAVALYNX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAVALYNX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAVALYNX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(obj-lavalynx/gradle/build/mobile/android/fenix/app/outputs/apk/nightly/fenix-arm64-v8a-nightly*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected one arm64 APK, found: ${apks[*]:-none}"; exit 1; }
          sdk=$HOME/.mozbuild/android-sdk-linux
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          aapt2=$(ls -d "$sdk"/build-tools/*/aapt2 | sort -V | tail -1)
          export JAVA_HOME=$(ls -d "$HOME"/.mozbuild/jdk/jdk-* | sort -V | tail -1)
          export PATH=$JAVA_HOME/bin:$PATH
          badging=$("$aapt2" dump badging "${apks[0]}")
          vname=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
          vcode=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
          out="lavalynx-$vname-$vcode.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/lavalynx-release.jks" --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$out" "${apks[0]}"
          "$apksigner" verify --print-certs "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      # Ties this exact APK digest to this repo, workflow and commit, so a
      # lavalynx-*.apk found anywhere can be proved to have come from the
      # published source. Nothing in the install path checks this, so it is
      # provenance, not protection.
      #   gh attestation verify lavalynx-<v>.apk --repo BackSlasher/lavalynx
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.apk.outputs.apk }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.apk }}" --title "$GITHUB_REF_NAME" --notes "lavalynx ${{ steps.apk.outputs.apk }} built from ${GITHUB_SHA::12}."

      # A dispatch run has no tag to publish against, so keep the APK where the
      # run can at least be inspected.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.apk.outputs.apk }}
          path: ${{ steps.apk.outputs.apk }}
